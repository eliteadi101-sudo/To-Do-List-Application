<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskflow</title><link rel="stylesheet" href="style.css"></head><body><main><h1>✓ Taskflow</h1><p class="sub">Small steps. Real progress.</p><form id="task-form"><input id="title" placeholder="What needs doing?" required maxlength="120"><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select><input id="due" type="date" aria-label="Due date"><button>Add task</button></form><nav><button data-filter="all" class="active">All</button><button data-filter="open">Active</button><button data-filter="done">Completed</button><span id="count"></span></nav><ul id="tasks"></ul><button id="clear" class="secondary">Clear completed</button></main><script src="app.js"></script></body></html>
